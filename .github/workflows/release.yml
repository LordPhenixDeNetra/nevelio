name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

# ── Jobs ───────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Plan (dry-run via cargo-dist) ───────────────────────────────────────
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cargo-dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/latest/download/cargo-dist-installer.sh \
            | sh

      - name: Plan
        id: plan
        run: |
          cargo dist plan --output-format=json > dist-manifest.json
          echo "manifest=$(cat dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: dist-manifest
          path: dist-manifest.json

  # ── 2. Cross-compiled Linux builds (musl) ──────────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.target }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            archive: nevelio-${{ github.ref_name }}-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            archive: nevelio-${{ github.ref_name }}-aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: cross build --release --target ${{ matrix.target }} -p nevelio

      - name: Package
        run: |
          ARCHIVE="${{ matrix.archive }}"
          mkdir -p "dist/$ARCHIVE"
          cp "target/${{ matrix.target }}/release/nevelio" "dist/$ARCHIVE/"
          cp README.md LICENSE "dist/$ARCHIVE/" 2>/dev/null || true
          cd dist
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}.tar.gz

  # ── 3. macOS builds ────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-13
            archive: nevelio-${{ github.ref_name }}-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: nevelio-${{ github.ref_name }}-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p nevelio

      - name: Package
        run: |
          ARCHIVE="${{ matrix.archive }}"
          mkdir -p "dist/$ARCHIVE"
          cp "target/${{ matrix.target }}/release/nevelio" "dist/$ARCHIVE/"
          cp README.md LICENSE "dist/$ARCHIVE/" 2>/dev/null || true
          cd dist
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}.tar.gz

  # ── 4. Windows build ───────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (x86_64-pc-windows-msvc)
    needs: plan
    runs-on: windows-latest
    env:
      ARCHIVE: nevelio-${{ github.ref_name }}-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc -p nevelio

      - name: Package
        shell: pwsh
        run: |
          $ARCHIVE = "$env:ARCHIVE"
          New-Item -ItemType Directory -Path "dist/$ARCHIVE" -Force
          Copy-Item "target/x86_64-pc-windows-msvc/release/nevelio.exe" "dist/$ARCHIVE/"
          if (Test-Path "README.md") { Copy-Item "README.md" "dist/$ARCHIVE/" }
          if (Test-Path "LICENSE")   { Copy-Item "LICENSE"   "dist/$ARCHIVE/" }
          Compress-Archive -Path "dist/$ARCHIVE" -DestinationPath "dist/$ARCHIVE.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: dist/${{ env.ARCHIVE }}.zip

  # ── 5. Publish GitHub Release ──────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip

  # ── 6. Docker Hub ──────────────────────────────────────────────────────────
  publish-docker:
    name: Publish Docker Hub
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            lordphenixdenetra/nevelio:${{ github.ref_name }}
            lordphenixdenetra/nevelio:latest

  # ── 7. Homebrew tap update ──────────────────────────────────────────────────
  publish-homebrew:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/latest/download/cargo-dist-installer.sh \
            | sh

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cargo dist generate --tag ${{ github.ref_name }}
          # cargo-dist génère et pousse automatiquement la formule dans le tap
