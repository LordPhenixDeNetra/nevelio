name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

# ── Jobs ───────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Plan (dry-run via cargo-dist) ───────────────────────────────────────
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cargo-dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/latest/download/cargo-dist-installer.sh \
            | sh

      - name: Plan
        id: plan
        run: |
          cargo dist plan --output-format=json > dist-manifest.json
          echo "manifest=$(cat dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: dist-manifest
          path: dist-manifest.json

  # ── 2. Cross-compiled Linux builds (musl) ──────────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.target }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            archive: nevelio-${{ github.ref_name }}-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            archive: nevelio-${{ github.ref_name }}-aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: cross build --release --target ${{ matrix.target }} -p nevelio

      - name: Package
        run: |
          ARCHIVE="${{ matrix.archive }}"
          mkdir -p "dist/$ARCHIVE"
          cp "target/${{ matrix.target }}/release/nevelio" "dist/$ARCHIVE/"
          cp README.md LICENSE "dist/$ARCHIVE/" 2>/dev/null || true
          cd dist
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}.tar.gz

  # ── 3. macOS builds ────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-13
            archive: nevelio-${{ github.ref_name }}-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: nevelio-${{ github.ref_name }}-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p nevelio

      - name: Package
        run: |
          ARCHIVE="${{ matrix.archive }}"
          mkdir -p "dist/$ARCHIVE"
          cp "target/${{ matrix.target }}/release/nevelio" "dist/$ARCHIVE/"
          cp README.md LICENSE "dist/$ARCHIVE/" 2>/dev/null || true
          cd dist
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}.tar.gz

  # ── 4. Windows build ───────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (x86_64-pc-windows-msvc)
    needs: plan
    runs-on: windows-latest
    env:
      ARCHIVE: nevelio-${{ github.ref_name }}-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc -p nevelio

      - name: Package
        shell: pwsh
        run: |
          $ARCHIVE = "$env:ARCHIVE"
          New-Item -ItemType Directory -Path "dist/$ARCHIVE" -Force
          Copy-Item "target/x86_64-pc-windows-msvc/release/nevelio.exe" "dist/$ARCHIVE/"
          if (Test-Path "README.md") { Copy-Item "README.md" "dist/$ARCHIVE/" }
          if (Test-Path "LICENSE")   { Copy-Item "LICENSE"   "dist/$ARCHIVE/" }
          Compress-Archive -Path "dist/$ARCHIVE" -DestinationPath "dist/$ARCHIVE.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: dist/${{ env.ARCHIVE }}.zip

  # ── 5. Build .deb packages ─────────────────────────────────────────────────
  build-deb:
    name: Build .deb (${{ matrix.arch }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            cross: false
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build binary (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p nevelio

      - name: Build binary (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --target ${{ matrix.target }} -p nevelio

      - name: Package .deb
        run: |
          mkdir -p dist
          cargo deb -p nevelio --no-build --target ${{ matrix.target }} \
            --output "dist/nevelio_${{ github.ref_name }}_${{ matrix.arch }}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/nevelio_${{ github.ref_name }}_${{ matrix.arch }}.deb

  # ── 6. Build .rpm packages ─────────────────────────────────────────────────
  build-rpm:
    name: Build .rpm (${{ matrix.arch }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm

      - name: Build binary (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p nevelio

      - name: Build binary (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --target ${{ matrix.target }} -p nevelio

      - name: Package .rpm
        run: |
          mkdir -p dist
          cargo generate-rpm -p nevelio --target ${{ matrix.target }}
          find target -name "*.rpm" -exec cp {} \
            "dist/nevelio_${{ github.ref_name }}_${{ matrix.arch }}.rpm" \;

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/nevelio_${{ github.ref_name }}_${{ matrix.arch }}.rpm

  # ── 7. Publish GitHub Release ──────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows, build-deb, build-rpm]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm

  # ── 8. Docker Hub ──────────────────────────────────────────────────────────
  publish-docker:
    name: Publish Docker Hub
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            lordphenixdenetra/nevelio:${{ github.ref_name }}
            lordphenixdenetra/nevelio:latest

  # ── 9. Homebrew tap update ──────────────────────────────────────────────────
  publish-homebrew:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/latest/download/cargo-dist-installer.sh \
            | sh

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cargo dist generate --tag ${{ github.ref_name }}
          # cargo-dist génère et pousse automatiquement la formule dans le tap

  # ── 10. Package repository apt + yum/dnf (GitHub Pages, branche packages) ──
  publish-packages:
    name: Publish apt + yum/dnf repository
    needs: [publish, build-deb, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download .deb packages
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: /tmp/deb
          merge-multiple: true

      - name: Download .rpm packages
        uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          path: /tmp/rpm
          merge-multiple: true

      - name: Install tools
        run: sudo apt-get install -y dpkg-dev apt-utils createrepo-c

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG \
            | awk '/^sec/{print $2}' | cut -d'/' -f2 | head -1)
          echo "GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout or initialize packages branch
        run: |
          if git show-ref --verify refs/remotes/origin/packages 2>/dev/null; then
            git checkout -B packages origin/packages
          else
            git checkout --orphan packages
            git rm -rf . --quiet 2>/dev/null || true
          fi

      # ── apt ──────────────────────────────────────────────────────────────

      - name: apt — add packages to pool
        run: |
          mkdir -p apt/pool/main
          cp /tmp/deb/*.deb apt/pool/main/

      - name: apt — generate Packages indices
        run: |
          for ARCH in amd64 arm64; do
            mkdir -p "apt/dists/stable/main/binary-${ARCH}"
            dpkg-scanpackages --arch "${ARCH}" apt/pool/main \
              > "apt/dists/stable/main/binary-${ARCH}/Packages"
            gzip -k "apt/dists/stable/main/binary-${ARCH}/Packages"
          done

      - name: apt — generate and sign Release file
        run: |
          {
            echo "Origin: Nevelio"
            echo "Label: Nevelio"
            echo "Suite: stable"
            echo "Codename: stable"
            echo "Architectures: amd64 arm64"
            echo "Components: main"
            echo "Description: Nevelio apt repository"
          } > apt/dists/stable/Release
          apt-ftparchive release apt/dists/stable >> apt/dists/stable/Release

          gpg --batch --yes \
            --passphrase "${{ secrets.APT_GPG_PASSPHRASE }}" \
            --pinentry-mode loopback \
            --default-key "$GPG_KEY_ID" \
            --clearsign -o apt/dists/stable/InRelease apt/dists/stable/Release

          gpg --batch --yes \
            --passphrase "${{ secrets.APT_GPG_PASSPHRASE }}" \
            --pinentry-mode loopback \
            --default-key "$GPG_KEY_ID" \
            -abs -o apt/dists/stable/Release.gpg apt/dists/stable/Release

          gpg --armor --export "$GPG_KEY_ID" > apt/KEY.gpg

      # ── yum/dnf ──────────────────────────────────────────────────────────

      - name: rpm — add packages and generate repodata
        run: |
          for ARCH in x86_64 aarch64; do
            mkdir -p "rpm/${ARCH}"
            cp /tmp/rpm/*_${ARCH}.rpm "rpm/${ARCH}/" 2>/dev/null || true
            createrepo_c "rpm/${ARCH}/"
            gpg --batch --yes \
              --passphrase "${{ secrets.APT_GPG_PASSPHRASE }}" \
              --pinentry-mode loopback \
              --default-key "$GPG_KEY_ID" \
              --detach-sign --armor \
              -o "rpm/${ARCH}/repodata/repomd.xml.asc" "rpm/${ARCH}/repodata/repomd.xml"
          done
          gpg --armor --export "$GPG_KEY_ID" > rpm/RPM-GPG-KEY-nevelio

      # ── commit ───────────────────────────────────────────────────────────

      - name: Commit and push packages branch
        run: |
          git add apt/ rpm/
          git commit -m "packages: nevelio ${{ github.ref_name }}"
          git push origin packages
