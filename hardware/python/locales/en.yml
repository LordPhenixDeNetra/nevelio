# cpa_analysis.py
# ══════════════════════════════════════════════════════════════════
cpa:
  banner: "\n  Nevelio CPA Analysis v{version}\n"
  simulate_info: "  [i] Simulation mode — generating {n} AES-128 traces..."
  secret_key: "  Simulated secret key: {key}\n"
  loading: "  Loading traces: {path}"
  shape: "  {n} traces x {s} samples\n"
  running: "  [*] CPA attack in progress..."
  byte_result: "  Byte {idx:2d} -> 0x{key:02X}  (max correlation: {corr:.4f})"
  key_recovered: "\n  Recovered key: {key}"
  key_correct: "  [✓] Key correctly recovered!"
  key_wrong: "  [!] {n}/16 bytes incorrect"
  tvla_running: "\n  [*] TVLA in progress..."
  tvla_result: "  TVLA -> |t|_max = {t:.2f}  ({status})"
  tvla_leak: "LEAK DETECTED"
  tvla_ok: "No leak detected"
  tvla_error: "  [!] TVLA not available: {error}"
  key_saved: "\n  [✓] Key saved: {path}"
  json_saved: "  [✓] JSON report: {path}"
  plot_saved: "  [✓] Plot saved: {path}"
  cpa_saved: "  [✓] CPA results saved: {path}"
  tvla_saved: "  [✓] TVLA saved: {path}"

  error:
    numpy_missing: "[✗] numpy required: pip install numpy"
    traces_required: "[✗] --traces required (or --simulate)"
    matplotlib_missing: "  [!] matplotlib not available — visualization skipped."

  help:
    traces: ".npz trace file (generated by chipwhisperer_acq.py)"
    simulate: "Generate simulated traces with realistic AES leakage (demo without hardware)"
    n: "Number of simulated traces (with --simulate)"
    tvla: "Run TVLA (Test Vector Leakage Assessment)"
    plot: "Generate matplotlib plots"
    plot_dir: "Directory for plots (default: .)"
    output_key: "Output file for recovered key (.hex)"
    output_json: "Full JSON report of results"


# ══════════════════════════════════════════════════════════════════
