  info_scope: "  Scope: {scope}  |  Objetivo: {target}"
  info_traces: "  Trazas solicitadas: {n}\n"
  simulate_forced: "  [i] Modo simulación activado (--simulate)."
  simulate_fallback: "  [!] ChipWhisperer no detectado — modo simulación."
  generating: "  Generando {n} trazas simuladas..."
