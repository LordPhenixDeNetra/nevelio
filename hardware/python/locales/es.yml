    scope: "Tipo de scope ChipWhisperer"
    target_type: "Protocolo objetivo (SimpleSerial v1 o v2)"
    gain: "Ganancia AFE en dB (predeterminado: {default})"
    samples: "Muestras por traza (predeterminado: {default})"
    output: "Archivo de salida .npz (predeterminado: traces.npz)"
    simulate: "Modo simulación — no requiere hardware"


