  target_ok: "  [✓] Objetivo conectado: {target}\n"
  acq_error: "  [✗] Error de adquisición: {error}"
  fallback_sim: "  Cambiando al modo simulación..."
  timeout: "  [!] Timeout en la traza {i}/{n}"
  progress: "  [*] {i}/{n} trazas adquiridas"
  done: "\n  [✓] {n} trazas adquiridas y guardadas."
  saved: "[✓] Trazas guardadas: {path}"
  meta_saved: "[✓] Metadatos       : {path}"

  error:
    cw_missing: "chipwhisperer no instalado. Instalar con: pip install chipwhisperer"
    target_conn: "chipwhisperer requerido para la conexión del objetivo"
    unknown_target: "Tipo de objetivo desconocido: {target}"
    numpy_sim: "numpy requerido para la simulación: pip install numpy"
    numpy_save: "numpy requerido para guardar: pip install numpy"
    numpy_load: "numpy requerido: pip install numpy"
    format: "Formato soportado: solo .npz"

  help:
