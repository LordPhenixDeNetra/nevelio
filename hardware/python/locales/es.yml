    matplotlib_missing: "  [!] matplotlib no disponible — visualización omitida."

  help:
    traces: "Archivo .npz de trazas (generado por chipwhisperer_acq.py)"
    simulate: "Generar trazas simuladas con fuga AES realista (demo sin hardware)"
    n: "Número de trazas simuladas (con --simulate)"
    tvla: "Ejecutar TVLA (Test Vector Leakage Assessment)"
    plot: "Generar gráficos matplotlib"
    plot_dir: "Directorio para los gráficos (predeterminado: .)"
    output_key: "Archivo de salida para la clave recuperada (.hex)"
    output_json: "Informe JSON completo de resultados"


