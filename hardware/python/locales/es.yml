cpa:
  banner: "\n  Nevelio CPA Analysis v{version}\n"
  simulate_info: "  [i] Modo simulación — generando {n} trazas AES-128..."
  secret_key: "  Clave secreta simulada: {key}\n"
  loading: "  Cargando trazas: {path}"
  shape: "  {n} trazas x {s} muestras\n"
  running: "  [*] Ataque CPA en curso..."
  byte_result: "  Byte {idx:2d} -> 0x{key:02X}  (correlación máx: {corr:.4f})"
  key_recovered: "\n  Clave recuperada: {key}"
  key_correct: "  [✓] ¡Clave correctamente recuperada!"
  key_wrong: "  [!] {n}/16 bytes incorrectos"
  tvla_running: "\n  [*] TVLA en curso..."
