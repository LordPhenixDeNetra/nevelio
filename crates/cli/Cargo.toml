[package]
name              = "nevelio"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
description.workspace = true
homepage.workspace    = true
repository.workspace  = true
keywords.workspace    = true
categories.workspace  = true
readme.workspace      = true

[[bin]]
name = "nevelio"
path = "src/main.rs"

[dependencies]
nevelio-core                  = { path = "../core",                  version = "0.1" }
nevelio-recon                 = { path = "../recon",                 version = "0.1" }
nevelio-reporting             = { path = "../reporting",             version = "0.1" }
nevelio-module-auth           = { path = "../modules/auth",          version = "0.1" }
nevelio-module-injection      = { path = "../modules/injection",     version = "0.1" }
nevelio-module-access-control = { path = "../modules/access-control",version = "0.1" }
nevelio-module-business-logic = { path = "../modules/business-logic",version = "0.1" }
nevelio-module-graphql        = { path = "../modules/graphql",       version = "0.1" }
nevelio-module-infra          = { path = "../modules/infra",         version = "0.1" }

clap.workspace               = true
tokio.workspace              = true
serde.workspace              = true
serde_json.workspace         = true
anyhow.workspace             = true
tracing.workspace            = true
tracing-subscriber.workspace = true
colored.workspace            = true
indicatif.workspace          = true
chrono.workspace             = true
toml.workspace               = true
ratatui.workspace            = true
crossterm.workspace          = true
reqwest.workspace            = true
rust-i18n.workspace          = true

[package.metadata.deb]
name                 = "nevelio"
maintainer           = "Nevelio Contributors"
copyright            = "2024, Nevelio Contributors"
license-file         = ["LICENSE", "0"]
extended-description = """\
Fast, modular API security scanner for REST and GraphQL APIs. \
Detects vulnerabilities from an OpenAPI spec or a bare URL and \
produces actionable reports (JSON, HTML, Markdown, JUnit XML, SARIF)."""
depends              = "$auto"
section              = "utils"
priority             = "optional"
assets               = [
  ["target/release/nevelio", "usr/bin/nevelio", "755"],
  ["README.md",              "usr/share/doc/nevelio/README.md", "644"],
]
