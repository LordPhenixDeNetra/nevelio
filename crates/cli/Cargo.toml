[package]
name              = "nevelio"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
description.workspace = true
homepage.workspace    = true
repository.workspace  = true
keywords.workspace    = true
categories.workspace  = true
readme.workspace      = true

[[bin]]
name = "nevelio"
path = "src/main.rs"

[features]
default = ["ai"]
ai      = ["dep:nevelio-ai"]

[dependencies]
nevelio-config                = { path = "../nevelio-config",        version = "0.1" }
nevelio-ai                    = { path = "../nevelio-ai",            version = "0.1", optional = true }
nevelio-core                  = { path = "../core",                  version = "0.1" }
nevelio-recon                 = { path = "../recon",                 version = "0.1" }
nevelio-reporting             = { path = "../reporting",             version = "0.1" }
nevelio-module-auth           = { path = "../modules/auth",          version = "0.1" }
nevelio-module-injection      = { path = "../modules/injection",     version = "0.1" }
nevelio-module-access-control = { path = "../modules/access-control",version = "0.1" }
nevelio-module-business-logic = { path = "../modules/business-logic",version = "0.1" }
nevelio-module-graphql        = { path = "../modules/graphql",       version = "0.1" }
nevelio-module-infra          = { path = "../modules/infra",         version = "0.1" }
nevelio-module-ssrf                = { path = "../modules/ssrf",                version = "0.1" }
nevelio-module-oauth2              = { path = "../modules/oauth2",              version = "0.1" }
nevelio-module-prototype-pollution = { path = "../modules/prototype-pollution", version = "0.1" }
nevelio-module-websocket           = { path = "../modules/websocket",           version = "0.1" }
nevelio-module-soap                = { path = "../modules/soap",                version = "0.1" }
nevelio-module-grpc                = { path = "../modules/grpc",                version = "0.1" }

clap.workspace               = true
tokio.workspace              = true
serde.workspace              = true
serde_json.workspace         = true
anyhow.workspace             = true
tracing.workspace            = true
tracing-subscriber.workspace = true
colored.workspace            = true
indicatif.workspace          = true
chrono.workspace             = true
toml.workspace               = true
ratatui.workspace            = true
crossterm.workspace          = true
reqwest.workspace            = true
rust-i18n.workspace          = true
rhai.workspace               = true
futures-util.workspace       = true
base64.workspace             = true
clap_complete                = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package.metadata.deb]
name                 = "nevelio"
maintainer           = "Nevelio Contributors"
copyright            = "2024, Nevelio Contributors"
license-file         = ["LICENSE", "0"]
extended-description = """\
Fast, modular API security scanner for REST and GraphQL APIs. \
Detects vulnerabilities from an OpenAPI spec or a bare URL and \
produces actionable reports (JSON, HTML, Markdown, JUnit XML, SARIF)."""
depends              = "$auto"
section              = "utils"
priority             = "optional"
assets               = [
  ["target/release/nevelio", "usr/bin/nevelio", "755"],
  ["README.md",              "usr/share/doc/nevelio/README.md", "644"],
]

[package.metadata.generate-rpm]
name        = "nevelio"
license     = "MIT"
summary     = "API security scanner for REST and GraphQL"
description = """\
Fast, modular API security scanner for REST and GraphQL APIs. \
Detects vulnerabilities from an OpenAPI spec or a bare URL and \
produces actionable reports (JSON, HTML, Markdown, JUnit XML, SARIF)."""
group       = "Applications/Security"
assets      = [
  { source = "target/release/nevelio", dest = "/usr/bin/nevelio", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/nevelio/README.md", mode = "644", doc = true },
]
