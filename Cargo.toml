[workspace]
members = [
    "crates/cli",
    "crates/core",
    "crates/nevelio-config",
    "crates/nevelio-ai",
    "crates/modules/auth",
    "crates/modules/injection",
    "crates/modules/access-control",
    "crates/modules/business-logic",
    "crates/modules/graphql",
    "crates/modules/infra",
    "crates/modules/ssrf",
    "crates/modules/oauth2",
    "crates/modules/prototype-pollution",
    "crates/modules/websocket",
    "crates/modules/soap",
    "crates/modules/grpc",
    "crates/recon",
    "crates/reporting",
]
resolver = "2"

[workspace.package]
version       = "0.1.0"
edition       = "2021"
authors       = ["Nevelio Contributors"]
license       = "MIT"
description   = "REST & GraphQL API penetration testing tool written in Rust"
homepage      = "https://github.com/LordPhenixDeNetra/nevelio"
repository    = "https://github.com/LordPhenixDeNetra/nevelio"
documentation = "https://lordphenixdenetra.github.io/nevelio"
keywords      = ["security", "pentest", "api", "scanner", "cli"]
categories    = ["command-line-utilities", "development-tools"]
readme        = "README.md"

[workspace.metadata.dist]
cargo-dist-version = "0.22.1"
ci                 = ["github"]
installers         = ["shell", "powershell", "homebrew"]
tap                = "LordPhenixDeNetra/homebrew-nevelio"
targets            = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
pr-run-mode = "plan"

[workspace.dependencies]
tokio              = { version = "1",    features = ["full"] }
reqwest            = { version = "0.13", features = ["json", "stream", "rustls", "webpki-roots", "http2"], default-features = false }
clap               = { version = "4",    features = ["derive"] }
serde              = { version = "1",    features = ["derive"] }
serde_json         = "1"
serde_yaml         = "0.9"
jsonwebtoken       = "10"
oas3               = { version = "0.21", features = ["yaml-spec"] }
indicatif          = "0.18"
tera               = "1"
anyhow             = "1"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored            = "3"
uuid               = { version = "1", features = ["v4"] }
chrono             = { version = "0.4", features = ["serde"] }
async-trait        = "0.1"
base64             = "0.22"
toml               = "0.8"
ratatui            = "0.29"
crossterm          = { version = "0.28", features = ["event-stream"] }
rust-i18n          = "3"
dirs               = "5"
toml_edit          = "0.22"
rhai               = { version = "1", features = ["sync"] }
wasmtime           = { version = "28", default-features = false, features = ["cranelift", "runtime"] }
futures-util       = "0.3"
hmac               = "0.12"
sha2               = "0.10"
